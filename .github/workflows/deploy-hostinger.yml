name: Deploy to Hostinger (Laravel)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.PORT }}" -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Upload project to server (rsync)
        shell: bash
        run: |
          rsync -az --delete \
            --filter='P .env' \
            --filter='P storage/***' \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "node_modules/" \
            -e "ssh -p ${{ secrets.PORT }}" \
            ./ "${{ secrets.USER }}@${{ secrets.HOST }}:${{ secrets.APP_DIR }}/"

      - name: Composer + Artisan (server)
        shell: bash
        run: |
          ssh -p "${{ secrets.PORT }}" "${{ secrets.USER }}@${{ secrets.HOST }}" << EOF
            set -e
            cd "${{ secrets.APP_DIR }}"

            echo "Now in: $(pwd)"
            echo "Checking .env..."
            ls -la .env

            # Ensure writable dirs exist
            mkdir -p storage/framework/{cache,sessions,views} bootstrap/cache

            # Install PHP dependencies
            composer install --no-dev --prefer-dist --optimize-autoloader

            # Laravel deploy commands (using Hostinger PHP CLI path)
            "${{ secrets.PHP_BIN }}" artisan migrate --force
            "${{ secrets.PHP_BIN }}" artisan config:cache || true
            "${{ secrets.PHP_BIN }}" artisan route:cache || true
            "${{ secrets.PHP_BIN }}" artisan view:cache || true

            echo "Deploy finished."
          EOF